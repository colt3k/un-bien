name: App CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual run, for the case this repo keeps hitting: a push that produced no
  # workflow run at all (fork-level Actions disable). Run it by hand and Actions
  # either lists a run or you have proof the suite is not running here.
  workflow_dispatch:

# NOTE: no "paths" filter — every job must REPORT on every push and PR, so a
# relay-/docs-only change never leaves a check stuck at "expected".
#
# TRUTH CHECK (2026-11-20): this repo has NO branch protection rules and NO
# rulesets — `Settings → Branches` offers only "Add branch ruleset" / "Add classic
# branch protection rule". Nothing here is a REQUIRED check; every job runs and
# reports, and a red suite does not block a merge. That is deliberate for a
# single-owner repo that pushes straight to main: the suite is meant to be a loud
# alarm in Actions within a minute of a push, and fixing forward is cheaper than
# gating. See the FORK CAVEAT below before relying on that alarm.
# If that ever changes, add a ruleset targeting `main`, toggle "Require status
# checks to pass", and list spm-tests / extension-tests / web-client-tests — with
# the owner in the bypass list, since a required check also rejects direct pushes
# while checks are queued or failing. Update this note in the same change.
#
# DECISION (2026-11-20, owner): Actions stay DISABLED on this fork. Do not try to
# re-enable them. This repository is a fork of `georgeharker/un-bien` (52 ahead,
# 18 behind as of writing) and carries GitHub's fork-level disable — the Actions tab
# shows "Workflows aren't being run on this forked repository" and the API reports
# ZERO runs here, ever.
#
# Consequence, stated so nobody is surprised: nothing in this file gates anything on
# this remote. These jobs are the recipe, and they run where the code lands with
# Actions on (upstream has ~281 App CI runs). Here, the suite is what YOU run, before
# pushing:
#
#   (cd web-client && pnpm test)      # 127 tests, incl. the 25-scenario corpus
#   (cd app && swift test)            # 178 tests
#
# A green local run is not "CI passed" — there is no CI here to pass. `workflow_dispatch`
# below exists so that if this decision ever flips, "did it start?" is one click.

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Full SPM suite (fast). NOTE: the unsigned CLI test process has no
  # data-protection-keychain entitlement, so the KeychainOwnerIdentityStore
  # persistence tests SKIP here (by design — see tryRequireDPKeychain).
  # The REAL keychain proof runs in the keychain-persistence job below.
  spm-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Swift test (SPM suite)
        working-directory: app
        run: swift test

  # The extension's vitest suite (protocol/reducers/mesh) — previously the
  # one suite not in CI. Node-only: rides ubuntu (no signing needed). Runs
  # the TS emit-direction conformance runner against the shared corpus.
  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No "version" input: package.json's packageManager field is
      # authoritative (pnpm/action-setup errors on a conflicting pin).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        # The project's TypeScript 6, not node_modules/.bin/tsc (the TS 7
        # @typescript/native alias that pi-lens uses for its language server).
        run: pnpm -C extension typecheck

      - name: Vitest (extension suite, incl. conformance emit-direction)
        run: pnpm -C extension test

  # The web client's vitest suite — including the conformance corpus (25
  # scenarios) folded by THIS client, both planes (watched live + cold arrival),
  # against the goldens the Swift reference mints. Until now no job touched
  # web-client: the corpus was checked in CI only through the reference, so a
  # web-only regression — a row boundary, a re-key, a late-birth ordering bug —
  # passed CI green. Mirrors extension-tests (same pinned actions, pnpm from
  # package.json's packageManager field).
  #
  # NOTE: running and REPORTING is not the same as REQUIRED. Making this a branch
  # protection check is a repository-settings change; until that is done, a failure
  # here is visible but does not block a merge.
  web-client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The client imports `@geohar/un-bien/client` from the workspace package;
      # build it so the client resolves the published entry points rather than
      # assuming a source-only export condition.
      - name: Build the workspace package the client imports
        run: pnpm -C extension build

      - name: Type check
        run: pnpm -C web-client typecheck

      - name: Vitest (web client, incl. the conformance corpus on both planes)
        run: pnpm -C web-client test

  # The issue #2 regression suite, run INSIDE the app's test host on the
  # iOS simulator — the only place the real (entitled) keychain is
  # reachable in CI. Simulates fresh install -> pair -> restart at the
  # keychain layer; fails if save() ever leaves the slot empty.
  keychain-persistence:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ hashFiles('app/Package.resolved') }}

      - name: Keychain persistence tests (simulator, real keychain)
        working-directory: app
        run: |
          set -o pipefail
          # Dynamic destination discovery: runner images rotate and simulator
          # names/OS versions drift (the hardcoded iPhone 17/16/15 chain failed
          # wholesale on the 2026-09-25 image rotation). Pick the first
          # AVAILABLE iPhone from simctl — version-agnostic.
          UDID=$(xcrun simctl list devices available \
            | grep "iPhone" \
            | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}" \
            | head -1)
          if [ -z "$UDID" ]; then
            echo "ERROR: no available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "==> using simulator $UDID"
          xcodebuild test \
            -scheme UnBien-iOS \
            -destination "id=$UDID" \
            -only-testing:UnBienCoreTestsHost \
            2>&1 | xcbeautify -q
