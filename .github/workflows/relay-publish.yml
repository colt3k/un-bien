---
name: Publish Relay Crate

"on":
  push:
    tags:
      # Component-scoped: the extension publishes on `v*`, the relay on
      # `relay-v*`, so a single monorepo tag never publishes both.
      - "relay-v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for crates.io OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable


      - run: cargo test --all-features

      - name: Mint a short-lived crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
