---
name: Publish CLI

"on":
  push:
    tags:
      # Component-scoped: extension publishes on `v*`, relay on
      # `relay-v*`, launcher on `launcher-v*`, cli on `cli-v*` — one
      # tag never publishes two packages.
      - "cli-v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.x"

      - run: npm install -g npm@latest

      # The CLI imports @geohar/un-bien/client for the relay + envelope
      # transport, so the extension must be built before it typechecks.
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C extension build
      - run: pnpm -C unbien-cli build

      # Guard the publish: the CLI's reducer is one of two interpreters of
      # the same wire, and its fixture tests are what keep them honest.
      - run: pnpm -C unbien-cli test

      # `pnpm publish` rewrites the `workspace:*` dep on @geohar/un-bien
      # to the concrete published version (npm publish can't).
      # Pre-release versions (containing '-') publish under the `dev` tag.
      - name: Detect pre-release
        id: prerelease
        working-directory: unbien-cli
        run: |
          VER=$(node -p "require('./package.json').version")
          if echo "$VER" | grep -q '-'; then
            echo "tag=--tag dev" >> "$GITHUB_OUTPUT"
            echo "pre-release $VER -> publishing under 'dev' tag"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish @geohar/unbien-cli
        working-directory: unbien-cli
        run: pnpm publish --provenance --access public --no-git-checks ${{ steps.prerelease.outputs.tag }}
