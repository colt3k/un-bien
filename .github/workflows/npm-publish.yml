---
name: Publish Package

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: "24.x"
          # No registry-url: it writes an .npmrc expecting
          # NODE_AUTH_TOKEN, shadowing OIDC (publish would 404).

      - run: npm install -g npm@latest

      # Install the whole workspace from the root lockfile, then
      # build/test + publish just the extension.
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C extension build
      - run: pnpm -C extension test
      # Pre-release versions (containing '-') publish under the `dev` tag,
      # not `latest` — so a dev release doesn't override the stable release.
      - name: Detect pre-release
        id: prerelease
        working-directory: extension
        run: |
          VER=$(node -p "require('./package.json').version")
          if echo "$VER" | grep -q '-'; then
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "pre-release $VER -> publishing under 'dev' tag"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish @geohar/un-bien
        working-directory: extension
        env:
          # The dist-tag for a pre-release (dev); empty publishes as latest.
          NPM_TAG: ${{ steps.prerelease.outputs.tag }}
        run: npm publish --provenance --access public ${NPM_TAG:+--tag "$NPM_TAG"}
