<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 572" role="img"
     aria-label="Two ways to run un-bien: the published path upstream ships, and this fork's checkout path"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect id="bg" x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <style>
    .up   { fill:#eef1f5; stroke:#94a3b8; stroke-width:1.5 }
    .fork { fill:#e7f6f1; stroke:#0f766e; stroke-width:1.8 }
    .panel{ fill:#fbfcfe; stroke:#cbd5e1; stroke-width:1; stroke-dasharray:5 4 }
    .t    { font-size:13.5px; fill:#0f172a; font-weight:600 }
    .s    { font-size:11.5px; fill:#5b6b7f }
    .h    { font-size:11px; fill:#334155; font-weight:700; letter-spacing:.08em }
    .hf   { font-size:11px; fill:#0f766e; font-weight:700; letter-spacing:.08em }
    .f    { font-size:11.5px; fill:#115e59 }
    .ttl  { font-size:19px; fill:#0f172a; font-weight:700 }
    .sub  { font-size:12.5px; fill:#64748b }
    .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11.5px }
    .arw  { stroke:#94a3b8; stroke-width:1.6; fill:none }
    .arwf { stroke:#0f766e; stroke-width:1.8; fill:none }
  </style>

  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <text class="ttl" x="32" y="34">Two ways to run this: the published path, and the checkout path</text>
  <text class="sub" x="32" y="56">upstream ships artifacts; this fork is set up to run from the source you are editing</text>

  <!-- lane 1: published -->
  <rect class="panel" x="32" y="84" width="976" height="140" rx="8"/>
  <text class="h" x="48" y="106">THE PUBLISHED PATH — WHAT UPSTREAM SHIPS</text>

  <rect class="up" x="48" y="118" width="212" height="62" rx="6"/>
  <text class="mono t" x="60" y="140">pi install npm:@geohar/un-bien</text>
  <text class="s" x="60" y="158">the extension, from the registry</text>

  <rect class="up" x="288" y="118" width="212" height="62" rx="6"/>
  <text class="mono t" x="300" y="140">cargo install un-bien-relay</text>
  <text class="s" x="300" y="158">or the Homebrew formula</text>

  <rect class="up" x="528" y="118" width="212" height="62" rx="6"/>
  <text class="t" x="540" y="140">App Store: Un Bien</text>
  <text class="s" x="540" y="158">the iOS client</text>

  <rect class="up" x="768" y="118" width="212" height="62" rx="6"/>
  <text class="mono t" x="780" y="140">@geohar/unbien-cli</text>
  <text class="s" x="780" y="158">the terminal client</text>

  <text class="s" x="48" y="204">Simple, and it works — that is upstream's product. The catch for a contributor: the code that runs is the registry's build, not the one in your editor.</text>

  <!-- lane 2: checkout -->
  <rect class="panel" x="32" y="240" width="976" height="192" rx="8"/>
  <text class="hf" x="48" y="262">THE CHECKOUT PATH — WHAT THIS FORK SETS UP</text>

  <rect class="fork" x="48" y="274" width="200" height="136" rx="6"/>
  <text class="mono t" x="60" y="298">scripts/</text>
  <text class="mono t" x="60" y="316">setup-from-clone.sh</text>
  <text class="f" x="60" y="338">one command, then</text>
  <text class="f" x="60" y="354">doctor for a read-only</text>
  <text class="f" x="60" y="370">state report any time</text>

  <path class="arwf" d="M248,333 L272,333" marker-end="url(#ct)"/>

  <rect class="fork" x="272" y="274" width="132" height="136" rx="6"/>
  <text class="f" x="284" y="298">1 · workspace</text>
  <text class="f" x="284" y="314">install + build:</text>
  <text class="f" x="284" y="330">pnpm for the TS,</text>
  <text class="f" x="284" y="346">cargo for the relay</text>
  <text class="f" x="284" y="368">no pnpm to install:</text>
  <text class="f" x="284" y="384">it resolves the pin</text>

  <path class="arwf" d="M404,333 L414,333" marker-end="url(#ct)"/>

  <rect class="fork" x="414" y="274" width="132" height="136" rx="6"/>
  <text class="f" x="426" y="298">2 · register THIS</text>
  <text class="f" x="426" y="314">checkout as pi's</text>
  <text class="f" x="426" y="330">extension, so pi</text>
  <text class="f" x="426" y="346">loads the code you</text>
  <text class="f" x="426" y="362">are editing — and</text>
  <text class="f" x="426" y="384">warns about any</text>
  <text class="f" x="426" y="400">global copy</text>

  <path class="arwf" d="M546,333 L556,333" marker-end="url(#ct)"/>

  <rect class="fork" x="556" y="274" width="132" height="136" rx="6"/>
  <text class="f" x="568" y="298">3 · relay as an OS</text>
  <text class="f" x="568" y="314">service: launchd or</text>
  <text class="f" x="568" y="330">systemd-user, with</text>
  <text class="f" x="568" y="346">the binary copied</text>
  <text class="f" x="568" y="362">OUT of the repo</text>
  <text class="f" x="568" y="384">(relay-service.sh</text>
  <text class="f" x="568" y="400">+ linger check)</text>

  <path class="arwf" d="M688,333 L698,333" marker-end="url(#ct)"/>

  <rect class="fork" x="698" y="274" width="132" height="136" rx="6"/>
  <text class="f" x="710" y="298">4 · launcher + cli</text>
  <text class="f" x="710" y="314">installed from the</text>
  <text class="f" x="710" y="330">checkout, not npm</text>
  <text class="f" x="710" y="362">sourceInstall.ts —</text>
  <text class="f" x="710" y="378">auto inside a</text>
  <text class="f" x="710" y="394">workspace checkout</text>

  <path class="arwf" d="M830,333 L840,333" marker-end="url(#ct)"/>

  <rect class="fork" x="840" y="274" width="132" height="136" rx="6"/>
  <text class="f" x="852" y="298">5 · web-client</text>
  <text class="f" x="852" y="314">served on :4173</text>
  <text class="f" x="852" y="330">(:5173 with --dev)</text>
  <text class="f" x="852" y="362">scripts/https.sh on</text>
  <text class="f" x="852" y="378">→ tailscale serve:</text>
  <text class="f" x="852" y="394">443 page, 3443 wss</text>

  <!-- why -->
  <rect class="fork" x="32" y="448" width="976" height="104" rx="8"/>
  <text class="t" x="48" y="474">Why the checkout path exists — a thing that was observed, not theorised</text>
  <text class="f" x="48" y="496">The extension's own <tspan class="mono">install launcher|cli|all</tspan> fetched from npm. A launcher daemon was seen running a months-old global build while the</text>
  <text class="f" x="48" y="514">checkout was the copy loaded into pi: a service running code nobody was editing. Hence sourceInstall.ts, and the global-copy warning in setup.</text>
  <text class="f" x="48" y="532">Two more service-unit traps are handled the same way: pi's <tspan class="mono">npmCommand</tspan> is followed so one package manager owns the install, and the unit</text>
  <text class="f" x="48" y="550">carries an explicit <tspan class="mono">service.env</tspan> plus an absolute runtime path — launchd and systemd start a daemon with only what the unit names.</text>
</svg>
